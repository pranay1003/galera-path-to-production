[defaults]
inventory          = inventory.ini
roles_path         = roles
remote_user        = ubuntu
# Ephemeral, freshly-created hosts identified by key — don't prompt on unknown host keys.
# Trade-off: fine for short-lived CI/prod nodes; revisit if hosts become long-lived.
host_key_checking  = False
interpreter_python = auto_silent
result_format      = yaml

[ssh_connection]
# Fewer SSH round-trips per task; safe on Ubuntu (no requiretty).
pipelining = True
