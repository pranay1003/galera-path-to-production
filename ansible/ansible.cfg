[defaults]
inventory          = inventory.ini
roles_path         = roles
remote_user        = ubuntu
# Ephemeral, freshly-created hosts identified by key — don't prompt on unknown host keys.
# Trade-off: fine for short-lived CI/prod nodes; revisit if hosts become long-lived.
host_key_checking  = False
interpreter_python = auto_silent
result_format      = yaml

[ssh_connection]
# No host-key prompts or known_hosts writes (ephemeral hosts; avoids a parallel race),
# and retry the TCP connect while sshd comes up on freshly booted nodes.
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ConnectionAttempts=30
# Fewer SSH round-trips per task; safe on Ubuntu (no requiretty).
pipelining = True
