---
# galera role (DESIGN §3). Runs with serial:1 + any_errors_fatal (see site.yml):
# one node at a time, stop the whole run on the first failure.

- name: Fail early if the SST password was not provided
  ansible.builtin.assert:
    that: galera_sst_password | default('') | length > 0
    fail_msg: "galera_sst_password must be set (pass it with --extra-vars; comes from a secret in CI)."
    quiet: true

- name: Install MariaDB, Galera and mariabackup
  ansible.builtin.apt:
    name: "{{ galera_packages }}"
    state: present

- name: Deploy Galera configuration
  ansible.builtin.template:
    src: galera.cnf.j2
    dest: "{{ galera_config_path }}"
    owner: root
    group: mysql
    mode: "0640" # contains the SST password; readable only by root and the mysql group
  register: galera_config

# --- Work out the current state of this node and the cluster ---------------

- name: Read this node's wsrep state
  ansible.builtin.command: >-
    mysql --socket={{ galera_mysql_socket }} -N -B
    -e "SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_status','wsrep_local_state_comment')"
  register: galera_wsrep_state
  changed_when: false
  failed_when: false # mysqld may be down or non-galera; absence of output means 'not synced'

- name: Record whether this node is already a synced primary
  ansible.builtin.set_fact:
    galera_node_synced: "{{ ('Synced' in galera_wsrep_state.stdout) and ('Primary' in galera_wsrep_state.stdout) }}"

- name: Check whether any peer is already running Galera (port 4567)
  ansible.builtin.wait_for:
    host: "{{ hostvars[item].ansible_host }}"
    port: 4567
    timeout: 3
    state: started
  loop: "{{ groups['galera'] | difference([inventory_hostname]) }}"
  register: galera_peer_probe
  # ignore_errors (not failed_when:false) so a timed-out probe keeps .failed=true;
  # a closed port is a valid 'peer down' answer, and we read .failed below.
  ignore_errors: true
  when: not galera_node_synced

- name: Record whether a cluster already exists on a peer
  ansible.builtin.set_fact:
    galera_peer_up: "{{ (galera_peer_probe.results | default([]) | selectattr('failed', 'equalto', false) | list | length) > 0 }}"

- name: Decide bootstrap vs join
  ansible.builtin.set_fact:
    # Bootstrap only the first node, only when nothing else is up (fresh or full-cluster cold start).
    galera_do_bootstrap: "{{ (not galera_node_synced) and (inventory_hostname == groups['galera'][0]) and (not galera_peer_up) }}"
    # Otherwise, a node that isn't synced must join an existing cluster.
    galera_do_join: "{{ (not galera_node_synced) and not ((inventory_hostname == groups['galera'][0]) and (not galera_peer_up)) }}"

# --- Bring the node up the right way ---------------------------------------

- name: Bootstrap a new cluster on the first node
  when: galera_do_bootstrap
  block:
    - name: Stop any standalone MariaDB before bootstrapping
      ansible.builtin.service:
        name: mariadb
        state: stopped
    - name: Create the primary component (galera_new_cluster)
      ansible.builtin.command: galera_new_cluster
      changed_when: true

- name: Join the existing cluster
  ansible.builtin.service:
    name: mariadb
    state: restarted # restart so the galera config is loaded; triggers SST/IST to join
  when: galera_do_join

- name: Apply a config change by rolling this already-synced node
  ansible.builtin.service:
    name: mariadb
    state: restarted
  when: galera_node_synced and galera_config.changed

- name: Ensure MariaDB is enabled on boot
  ansible.builtin.service:
    name: mariadb
    enabled: true

- name: Wait until this node reports Synced
  ansible.builtin.command: >-
    mysql --socket={{ galera_mysql_socket }} -N -B
    -e "SHOW STATUS LIKE 'wsrep_local_state_comment'"
  register: galera_wsrep_synced
  until: "'Synced' in galera_wsrep_synced.stdout"
  retries: "{{ galera_synced_retries }}"
  delay: "{{ galera_synced_delay }}"
  changed_when: false

# --- Cluster-level setup (first node only; replicates to the rest) ----------

- name: Create the SST user (first node; replicates to joiners)
  ansible.mysql.mysql_user:
    name: "{{ galera_sst_user }}"
    password: "{{ galera_sst_password }}"
    host: localhost
    priv: "*.*:RELOAD,PROCESS,LOCK TABLES,REPLICATION CLIENT"
    login_unix_socket: "{{ galera_mysql_socket }}"
    state: present
  no_log: true # don't print the SST password
  when: inventory_hostname == groups['galera'][0]

- name: Create the HAProxy health-check user (first node; no password, replicates)
  ansible.mysql.mysql_query:
    login_unix_socket: "{{ galera_mysql_socket }}"
    query:
      - "CREATE USER IF NOT EXISTS '{{ haproxy_check_user }}'@'%'"
      - "GRANT USAGE ON *.* TO '{{ haproxy_check_user }}'@'%'"
  changed_when: false # IF NOT EXISTS is a no-op once created; keeps re-runs clean
  when: inventory_hostname == groups['galera'][0]
