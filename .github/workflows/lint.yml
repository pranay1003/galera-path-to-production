---
name: lint

# Fast, cloud-free checks for pull requests (DESIGN §5). No AWS, no secrets.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; cancel older runs when new commits land.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tooling
        run: pip install -r requirements.txt

      - name: yamllint
        run: yamllint ansible/

      - name: ansible-lint
        run: ansible-lint ansible/

      - name: Syntax check playbooks
        run: ansible-playbook --syntax-check ansible/site.yml ansible/verify.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate (no backend; offline)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checkov (Terraform IaC scan)
        run: |
          pip install checkov
          checkov --config-file .checkov.yaml

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
